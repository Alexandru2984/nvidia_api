name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # settings.py reads these at import time; tests swap in sqlite/test
      # values via nvidia_chat.test_settings, so stubs are enough here.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DB_NAME: ci
      DB_USER: ci
      DB_PASSWORD: ci
      NVIDIA_API_KEY: nvapi-ci-stub
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Django system checks
        run: python manage.py check --settings=nvidia_chat.test_settings
      - name: Validate immutable GitHub Actions
        run: |
          python ../scripts/test_github_actions_pins.py
          python ../scripts/check_github_actions_pins.py ../.github/workflows
      - name: Validate production wheel lock
        run: python ../scripts/check_requirements_lock.py requirements.txt requirements.lock
      - name: Run tests
        run: python -m pytest -q
      - name: Security monitor tests
        run: python ../scripts/test_security_monitor.py
      - name: Audit runtime dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Responsive browser tests
        run: npm run test:e2e
