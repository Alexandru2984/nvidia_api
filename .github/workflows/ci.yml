name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # settings.py reads these at import time; tests swap in sqlite/test
      # values via nvidia_chat.test_settings, so stubs are enough here.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      TWO_FACTOR_KEYS: '{"ci-v1":"AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="}'
      TWO_FACTOR_ACTIVE_KEY_ID: ci-v1
      TWO_FACTOR_LEGACY_SECRET_KEY_ENABLED: 'false'
      ADMIN_AUDIT_KEYS: '{"ci-v1":"AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI="}'
      ADMIN_AUDIT_ACTIVE_KEY_ID: ci-v1
      ADMIN_AUDIT_LEGACY_SECRET_KEY_ENABLED: 'false'
      DB_NAME: ci
      DB_USER: ci
      DB_PASSWORD: ci
      NVIDIA_API_KEY: nvapi-ci-stub
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements-ci.lock
            backend/requirements-audit.lock
            backend/requirements-provenance.lock
      - name: Validate immutable GitHub Actions
        run: |
          python ../scripts/test_github_actions_pins.py
          python ../scripts/check_github_actions_pins.py ../.github/workflows
      - name: Validate production wheel lock
        run: |
          python ../scripts/check_requirements_lock.py requirements.txt requirements.lock
          python ../scripts/check_ci_requirements_lock.py \
            requirements.txt requirements-dev.txt requirements.lock requirements-ci.lock \
            requirements-audit.lock
      - name: Install dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check --only-binary=:all: --require-hashes \
            -r requirements-ci.lock
      - name: Verify PyPI publisher provenance
        run: |
          python -m venv /tmp/aichat-pypi-provenance
          /tmp/aichat-pypi-provenance/bin/python -m pip install \
            --disable-pip-version-check --only-binary=:all: --require-hashes \
            -r requirements-provenance.lock
          /tmp/aichat-pypi-provenance/bin/python \
            ../scripts/verify_python_provenance.py \
            requirements.lock python-provenance-policy.json
      - name: Django system checks
        run: python manage.py check --settings=nvidia_chat.test_settings
      - name: Run tests
        run: python -m pytest -q
      - name: Security operations tests
        run: |
          bash -n ../scripts/*.sh
          shellcheck ../scripts/*.sh
          python ../scripts/test_security_monitor.py
          python ../scripts/test_privacy_logging.py
          python ../scripts/test_privacy_notice_contract.py
          python ../scripts/test_restore_drill_schedule.py
          python ../scripts/test_model_probe_isolation.py
          python ../scripts/test_configure_two_factor_keys.py
          python ../scripts/test_archive_release_retention.py
          python ../scripts/test_build_frontend_release.py
          python ../scripts/test_dependency_update_policy.py
          python ../scripts/test_release_provenance.py
          python ../scripts/test_generate_python_sbom.py
          python ../scripts/test_runtime_secret_hygiene.py
          python ../scripts/test_application_credentials.py
          python ../scripts/test_incident_controls.py
          python ../scripts/test_python_provenance.py
          python ../scripts/test_ci_requirements_lock.py
          python ../scripts/test_ci_trust_boundary.py
          python ../scripts/generate_python_sbom.py requirements.lock \
            --commit "$GITHUB_SHA" --output /tmp/aichat-python.cdx.json
          python ../scripts/generate_python_sbom.py requirements.lock \
            --commit "$GITHUB_SHA" --check /tmp/aichat-python.cdx.json
      - name: Audit runtime dependencies
        run: |
          python -m venv "${RUNNER_TEMP}/aichat-pip-audit"
          "${RUNNER_TEMP}/aichat-pip-audit/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: --require-hashes \
            -r requirements-audit.lock
          "${RUNNER_TEMP}/aichat-pip-audit/bin/pip-audit" \
            -r requirements-audit.lock --progress-spinner off
          "${RUNNER_TEMP}/aichat-pip-audit/bin/pip-audit" \
            -r requirements-ci.lock --progress-spinner off
          "${RUNNER_TEMP}/aichat-pip-audit/bin/pip-audit" \
            -r requirements-provenance.lock --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: |
          ../scripts/build_frontend_release.sh
          test "$(cat dist/.release-commit)" = "$GITHUB_SHA"
          test "$(cat dist/.release-frontend-tree)" = "$(git rev-parse HEAD:frontend)"
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Verify registry signatures and provenance
        run: npm audit signatures
      - name: Install test browser
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Responsive browser tests
        run: npm run test:e2e
