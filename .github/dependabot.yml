version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:10"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      frontend-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps/frontend)"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "04:20"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps/python)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "04:30"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps/actions)"
