# Drop-in for aichat-backend.service. Test on this host before enabling.
[Service]
UMask=0077
# Gunicorn 25 enables an optional control socket and falls back to ~/.gunicorn
# when the per-user runtime directory is unavailable. The service does not use
# that interface, and ProtectHome intentionally makes the fallback read-only.
Environment=GUNICORN_CMD_ARGS=--no-control-socket
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=tmpfs
BindReadOnlyPaths=/home/micu/nvidia/backend
ReadWritePaths=/home/micu/nvidia/backend/media /home/micu/nvidia/backend/.cache
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
CapabilityBoundingSet=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallArchitectures=native
LimitCORE=0
TasksMax=128
MemoryHigh=1G
MemoryMax=1536M
