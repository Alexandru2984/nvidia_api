server {
    listen 80;
    listen [::]:80;
    server_name r.micutu.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://r.micutu.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name r.micutu.com;

    ssl_certificate /etc/letsencrypt/live/r.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/r.micutu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($from_cloudflare_origin = 0) { return 403; }

    include snippets/block-dotfiles.conf;
    server_tokens off;
    client_max_body_size 25m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    send_timeout 60s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn rtraffic_conn 12;

    access_log /var/log/nginx/r.micutu.com.access.log;
    error_log /var/log/nginx/r.micutu.com.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' wss://r.micutu.com https://cloudflareinsights.com" always;

    location / {
        limit_except GET HEAD POST { deny all; }
        limit_req zone=rtraffic_http burst=80 nodelay;

        proxy_pass http://127.0.0.1:3838;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rtraffic_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    error_page 429 = @ratelimited;
    location @ratelimited {
        default_type text/plain;
        add_header Retry-After 30 always;
        return 429 "Too many requests. Slow down and try again.\n";
    }
}
