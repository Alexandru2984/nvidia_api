# Loaded once from nginx's http context.
limit_req_zone $binary_remote_addr zone=unison_http:10m rate=120r/m;

map $request_method $unison_write_client {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $unison_write_client zone=unison_write:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=unison_conn:10m;

map $http_upgrade $unison_connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_origin $unison_origin_allowed {
    default                      0;
    "https://unison.micutu.com" 1;
}
