server {
    include snippets/block-dotfiles.conf;
    server_name shop.micutu.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location = /RewardHub/api/auth/login {
        limit_except POST { deny all; }
        limit_req zone=gtshop_login burst=3 nodelay;
        client_max_body_size 16k;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /RewardHub/api/rewards {
        limit_except GET { deny all; }
        limit_req zone=gtshop_catalog burst=20 nodelay;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /RewardHub/ {
        return 403;
    }

    location / {
        root /var/www/gtshop;
        index gtshop.html;
        try_files $uri $uri/ =404;
    }

    include snippets/security-headers.conf;
    include snippets/robots.conf;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/shop.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.micutu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    include snippets/block-dotfiles.conf;
    listen 80;
    server_name shop.micutu.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
