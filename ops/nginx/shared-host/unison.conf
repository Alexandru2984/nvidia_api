server {
    listen 80;
    listen [::]:80;
    server_name unison.micutu.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://unison.micutu.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name unison.micutu.com;

    ssl_certificate /etc/letsencrypt/live/unison.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unison.micutu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($from_cloudflare_origin = 0) { return 403; }

    root /var/www/unison.micutu.com/current;
    index index.html;
    include snippets/block-dotfiles.conf;
    server_tokens off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn unison_conn 12;

    access_log /var/log/nginx/unison.micutu.com.access.log;
    error_log /var/log/nginx/unison.micutu.com.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' wss://unison.micutu.com https://cloudflareinsights.com; upgrade-insecure-requests" always;

    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location = /api/health {
        limit_except GET { deny all; }
        limit_req zone=unison_http burst=40 nodelay;

        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    location = /api/idea {
        limit_except GET POST { deny all; }
        limit_req zone=unison_http burst=40 nodelay;
        limit_req zone=unison_write burst=4 nodelay;

        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_send_timeout 8s;
    }

    location = /ws {
        if ($request_method != GET) { return 405; }
        if ($unison_origin_allowed = 0) { return 403; }

        limit_req zone=unison_http burst=20 nodelay;
        limit_conn unison_conn 4;
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $unison_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires max;
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    error_page 429 = @ratelimited;
    location @ratelimited {
        default_type text/plain;
        add_header Retry-After 30 always;
        return 429 "Too many requests. Slow down and try again.\n";
    }
}
