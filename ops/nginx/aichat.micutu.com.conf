# Install at /etc/nginx/sites-available/aichat.micutu.com after nginx -t.
# CF-Connecting-IP trust and nvidia_admin_limit are defined by host-wide config.
server {
    listen 443 ssl;
    server_name aichat.micutu.com;
    server_tokens off;
    root /var/www/aichat.micutu.com;
    index index.html;
    client_max_body_size 12m;

    ssl_certificate /etc/letsencrypt/live/aichat.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aichat.micutu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    # RFC 9116 disclosure contact. Exact match intentionally precedes the
    # host-wide dotfile deny rule.
    location = /.well-known/security.txt {
        default_type text/plain;
        try_files $uri =404;
    }
    include snippets/block-dotfiles.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; media-src 'self'; worker-src 'self' blob:" always;

    location ~ ^/api/(conversations/[0-9]+/messages|messages/[0-9]+/regenerate)/?$ {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
    }
    location /admin/ {
        limit_req zone=nvidia_admin_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        alias /home/micu/nvidia/backend/staticfiles/;
        access_log off;
        expires 30d;
    }
    # Private attachments MUST go through the ownership-checked API.
    # ^~ prevents future regex locations from exposing old paths.
    location ^~ /media/ { return 404; }
    location /assets/ {
        access_log off;
        expires 30d;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name aichat.micutu.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://aichat.micutu.com$request_uri; }
}
