# AI Chat Hub local attachment scanner. Files are sent with clamd INSTREAM;
# this daemon must never be exposed through a TCP socket.
LocalSocket /run/clamav/clamd.ctl
FixStaleSocket true
LocalSocketGroup clamav
LocalSocketMode 660
User clamav
TemporaryDirectory /tmp

DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly true
SelfCheck 600

LogClean false
LogVerbose false
ExtendedDetectionInfo false
JsonStoreHTMLURIs false
JsonStorePDFURIs false
JsonStoreExtraHashes false

Foreground false
Debug false
ExitOnOOM true
LeaveTemporaryFiles false
FollowDirectorySymlinks false
FollowFileSymlinks false
CrossFilesystems false

MaxThreads 4
MaxConnectionQueueLength 16
MaxQueue 32
ReadTimeout 30
CommandReadTimeout 10
SendBufTimeout 20
IdleTimeout 30

StreamMaxLength 11M
MaxScanTime 15000
MaxScanSize 50M
MaxFileSize 11M
MaxRecursion 12
MaxFiles 2000
MaxPartitions 20
MaxIconsPE 50
PCREMatchLimit 10000
PCRERecMatchLimit 5000
PCREMaxFileSize 11M

ScanArchive true
ScanMail false
ScanPE true
ScanELF true
ScanOLE2 true
ScanPDF true
ScanHTML true
ScanXMLDOCS true
ScanHWP3 false
ScanSWF true
ScanPartialMessages false
StructuredDataDetection false
AlgorithmicDetection true
PhishingSignatures true
PhishingScanURLs true
AlertEncrypted true
AlertExceedsMax true

Bytecode true
BytecodeSecurity TrustSigned
BytecodeTimeout 10000
DisableCache false
ForceToDisk false

EnableShutdownCommand false
EnableReloadCommand false
EnableStatsCommand false
EnableVersionCommand false
